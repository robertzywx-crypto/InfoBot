<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 InforBot </title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00e5ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="InfoBot">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
/* ============================================================
   🎨 INFORBOT — CSS FINAL (VERTICAL + NEON + SEM BUG)
   ============================================================ */

/* ================= VARIÁVEIS ================= */
:root {
    --bg: #010409;
    --app: #0d1117;
    --text: #c9d1d9;
    --accent: #1f6feb;
    --border: #30363d;

    --bubble-bot: #161b22;
    --text-bot: #e6edf3;

    --neon-blue: 0 0 8px #1f6feb, 0 0 18px #1f6feb;
    --header: linear-gradient(135deg, #000428, #004e92, #000000);
}

/* ================= MODO CLARO ================= */
body.light-mode {
    --bg: #eef2f7;
    --app: #ffffff;
    --text: #0f172a;
    --border: #cfd6e0;

    --bubble-bot: #f3f5f9;
    --text-bot: #0f172a;

    --neon-blue: 0 0 8px #2563eb, 0 0 18px #60a5fa;
    --header: linear-gradient(135deg, #2563eb, #60a5fa);
}

/* ================= RESET ================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
    transition: 0.25s ease;
}

body {
    height: 100vh;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= APP ================= */
.app {
    width: 96%;
    max-width: 1400px;
    height: 96vh;
    background: var(--app);
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    border: 2px solid var(--border);
    box-shadow: var(--neon-blue);
    overflow: hidden;
}

/* ================= HEADER ================= */
.header {
    background: var(--header);
    padding: 22px;
    text-align: center;
    color: white;
    border-bottom: 2px solid var(--accent);
    box-shadow: var(--neon-blue);
}

.title {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 10px;
    text-transform: uppercase;
    text-shadow: var(--neon-blue);
    animation: float 3s ease-in-out infinite;
}

.subtitle {
    font-size: 12px;
    color: #00ff88;
    margin-top: 5px;
    font-style: italic;
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}

/* ================= CHAT ================= */
.chat {
    flex: 1;
    padding: 22px;
    overflow-y: auto;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* ================= BOLHAS ================= */
.bot-msg {
    display: flex;
    justify-content: flex-start;
    margin-bottom: 8px;
}

.user-msg {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 8px;
}

.bubble {
    padding: 14px 20px;
    border-radius: 22px;
    font-size: 16px;
    max-width: 80%;
    line-height: 1.5;
    word-wrap: break-word;
}

.bot-msg .bubble {
    background: var(--bubble-bot);
    color: var(--text-bot);
    border: 1px solid var(--accent);
    box-shadow: 0 0 10px rgba(31,111,235,.35);
}

.user-msg .bubble {
    background: var(--accent);
    color: white;
    box-shadow: var(--neon-blue);
}

/* ================= STATUS ================= */
.status {
    display: none;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    font-weight: bold;
    padding: 10px 20px;
}

.spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--accent);
    border-top: 2px solid transparent;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ================= INPUT ================= */
.input-area {
    padding: 14px;
    background: var(--app);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
}

input {
    flex: 1;
    padding: 14px 22px;
    border-radius: 30px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    outline: none;
    font-size: 16px;
}

input:focus {
    border-color: var(--accent);
    box-shadow: var(--neon-blue);
}

/* ================= BOTÕES ================= */
.btn-ui, .game-btn {
    background: rgba(255,255,255,0.08);
    border: 2px solid white;
    color: white;
    padding: 10px 20px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
}

.btn-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
    justify-content: center;
}

.anim:hover {
    transform: scale(1.25);
    background: var(--accent);
    box-shadow: var(--neon-blue);
}

/* ================= BOTÕES CIRCULARES ================= */
.circle-btn, .send-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    cursor: pointer;
    font-size: 20px;
}

.circle-btn:hover, .send-btn:hover {
    box-shadow: 0 0 0 5px rgba(31,111,235,0.25), var(--neon-blue);
    transform: scale(1.15);
}

/* ================= ANIMAÇÕES ================= */
@keyframes acerto {
    0% { box-shadow: 0 0 0 #2ecc71; }
    50% { box-shadow: 0 0 30px #2ecc71; }
    100% { box-shadow: 0 0 10px #2ecc71; }
}

@keyframes erro {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
}

.msg-acerto {
    animation: acerto 0.6s;
    border: 2px solid #2ecc71 !important;
}

.msg-erro {
    animation: erro 0.5s;
    border: 2px solid #e74c3c !important;
}

/* ================= RESPONSIVO ================= */
@media (max-width: 768px) {
    .app {
        width: 100%;
        height: 100%;
        border-radius: 0;
    }

    .title {
        font-size: 28px;
        letter-spacing: 6px;
    }

    .input-area {
        padding-bottom: 22px;
    }

    .bubble {
        max-width: 95%;
    }
}

@media (max-width: 430px) {
    .title {
        font-size: 24px;
    }

    input {
        padding: 12px 18px;
        font-size: 16px;
    }

    .subtitle {
        font-size: 10px;
    }
}

    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="title">🤖 INFORBOT</div>
        <div class="subtitle"> </div>
        <div class="ui-box">
            <div class="btn-row">
                <button class="btn-ui anim" onclick="setMode('light')">MODO CLARO</button>
                <button class="btn-ui anim" onclick="setMode('dark')">MODO ESCURO</button>
            </div>
            <div class="btn-row">
                <button class="btn-ui anim" onclick="abrirMenuJogos()">🎮 JOGOS</button>
                <button class="btn-ui anim" onclick="botSay('💬 Conversa ativada! Fale livremente.')">💬 CONVERSAR</button>
                <button class="btn-ui anim" onclick="limparChat()">🗑️ LIMPAR</button>
            </div>
        </div>
    </div>

    <div id="chat" class="chat">
        <div class="bot-msg">
            <div class="bubble">🤖 olá chefe </div>
        </div>
    </div>

    <div id="loading" class="status">
        <div class="spinner"></div> 🧠 Pensando...
    </div>

    <div class="input-area">
        <button class="circle-btn" onclick="listen()">🎤</button>
        <input type="text" id="userInput" placeholder="Converse, pergunte, desabafe...">
        <button class="send-btn" onclick="send()">➤</button>
    </div>
</div>

<script>
// ============================================================
// 🧠 INFORBOT COM IA GROQ + MEMÓRIA LONGA (100+ MENSAGENS)
// ============================================================

// ⚙️ CONFIGURAÇÃO
const GROQ_API_KEY = "gsk_...1wQ3";
const GROQ_API_URL = "https://api.groq.com/openai/v1/chat/completions";

// 🧠 HISTÓRICO DE CONVERSA COM PERSISTÊNCIA
let conversaHistory = [];
let modoJogo = false;
let respostaCerta = "";

// Carregar histórico do localStorage
function carregarHistorico() {
    const saved = localStorage.getItem("inforbot_historico");
    if (saved) {
        try {
            conversaHistory = JSON.parse(saved);
            console.log("✅ Histórico carregado:", conversaHistory.length, "mensagens");
        } catch(e) {
            console.log("⚠️ Erro ao carregar histórico");
            conversaHistory = [];
        }
    }
}

// Salvar histórico no localStorage
function salvarHistorico() {
    localStorage.setItem("inforbot_historico", JSON.stringify(conversaHistory));
}

// Database de jogos
const DATABASE = {
    anatomia: [
        {q: "Qual o maior osso do corpo humano?", a: "femur"},
        {q: "Qual o maior órgão do corpo humano?", a: "pele"},
        {q: "Quantos ossos tem um adulto?", a: "206"},
        {q: "Qual o músculo mais forte do corpo?", a: "masseter"}
    ],
    geografia: [
        {q: "Qual a capital do Brasil?", a: "brasilia"},
        {q: "Qual a capital da França?", a: "paris"},
        {q: "Qual a capital do Japão?", a: "toquio"}
    ]
};

// ============================================================
// 1️⃣ FUNÇÃO DE ENVIO
// ============================================================
function send() {
    const input = document.getElementById("userInput");
    const texto = input.value.trim();
    
    if (!texto) return;

    userSay(texto);
    input.value = "";
    input.focus();
    
    analyze(texto);
}

// ============================================================
// 2️⃣ CÉREBRO COM IA GROQ E MEMÓRIA LONGA
// ============================================================
async function analyze(msg) {
    let raw = msg.toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

    // --- A: VERIFICAÇÃO DE JOGO ATIVO ---
    if (modoJogo) {
        if (raw.includes(respostaCerta.toString().toLowerCase())) {
            modoJogo = false;
            return botSayAnim("🎆 **FENOMENAL!** Você acertou, Roberto!", "acerto");
        } else if (raw === "parar" || raw === "sair") {
            modoJogo = false;
            return botSay("Jogo encerrado. Quer conversar agora?");
        } else {
            return botSayAnim("❌ **ERRADO!** Tente de novo ou diga 'parar'.", "erro");
        }
    }

    // --- B: COMANDO JOGOS ---
    if (raw === "jogos" || raw === "jogo") {
        return botSay("🎮 **MENU DE JOGOS DO INFORBOT**<br><br>" +
               "Roberto, digite apenas a letra para começar:<br><br>" +
               "🅰️ **A** - Jogo da Sorte (1 a 10)<br>" +
               "🅱️ **B** - Desafio de Matemática<br>" +
               "🅲 **C** - Quiz de Anatomia<br>" +
               "🅳 **D** - Quiz de Capitais<br>" +
               "🅴 **E** - Palavra Invertida<br><br>" +
               "Diga **'parar'** para sair de um jogo.");
    }

    // --- C: LETRA DO JOGO ---
    if (["a", "b", "c", "d", "e"].includes(raw)) {
        return iniciarJogo(raw);
    }

    // --- D: MATEMÁTICA SIMPLES ---
    if (/[0-9]/.test(raw) && /[\+\-\*\/\^vx:]/.test(raw)) {
        try {
            let exp = raw.replace(/x/g, "*").replace(/:/g, "/").replace(/v/g, "sqrt").replace(/,/g, ".");
            let res = math.evaluate(exp);
            return botSay(`Roberto, o resultado é: **${res}**.`);
        } catch(e) {}
    }

    // --- E: USA IA DO GROQ COM MEMÓRIA LONGA ---
    setLoading(true);
    await respostaComIA(msg);
    setLoading(false);
}

// ============================================================
// 3️⃣ IA COM GROQ - MEMÓRIA ATÉ 1000 PALAVRAS
// ============================================================
async function respostaComIA(msg) {
    // Adiciona mensagem do usuário
    conversaHistory.push({
        role: "user",
        content: msg
    });

    // 🧠 AUMENTADO: Mantém até 100 mensagens (aprox 1000 palavras)
    if (conversaHistory.length > 100) {
        conversaHistory = conversaHistory.slice(-100);
    }

    // Salva no localStorage
    salvarHistorico();

    try {
        const systemPrompt = `Você é o Inforbot, um assistente de IA criado por Roberto. Você é:
- Conversável e natural, como um amigo próximo
- Empático: reconhece sentimentos, reconforta quem está triste, comemora alegrias
- eligente: explica conceitos, responde perguntas complexas, pensa antes de reIntsponder
- Investigativo: quando apropriado, avisa que vai pesquisar sobre algo na Wikipedia
- Bem-humorado: faz piadas, é descontraído
- Respeitoso: escuta desabafos sem julgamento
- IMPORTANTE: Você tem MEMÓRIA LONGA agora! Lembra de tudo que foi conversado

CONTEXTO DA CONVERSA:
Você está tendo uma conversa longa com Roberto. Pode referenciar coisas que ele falou antes, 
lembrar de preferências dele, de histórias que contou, de problemas que mencionou.
Isso torna a conversa muito mais natural e pessoal.

IMPORTANTE:
- Respostas curtas e naturais (como conversas reais)
- Se reconhecer tristeza, estresse ou desespero, mostre empatia PRIMEIRO
- Se precisar pesquisar, avisa: "Deixa eu pesquisar isso pra você..."
- Use emojis naturalmente
- Sempre em português do Brasil
- Seja amigo, não apenas informativo
- APROVEITE A MEMÓRIA LONGA - Faça referências a coisas que ele falou antes!

Responda como um humano que realmente se importa.`;

        const response = await fetch(GROQ_API_URL, {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${GROQ_API_KEY}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "mixtral-8x7b-32768",
                messages: [
                    { role: "system", content: systemPrompt },
                    ...conversaHistory
                ],
                temperature: 0.7,
                max_tokens: 500
            })
        });

        if (!response.ok) {
            const errorData = await response.json();
            console.error("Erro da API:", errorData);
            throw new Error(`Erro ${response.status}`);
        }

        const data = await response.json();
        const resposta = data.choices[0].message.content;

        // Adiciona resposta ao histórico
        conversaHistory.push({
            role: "assistant",
            content: resposta
        });

        // Salva histórico atualizado
        salvarHistorico();

        botSay(resposta);

        // Se a IA mencionou que vai pesquisar
        if (resposta.toLowerCase().includes("pesquisar") || resposta.toLowerCase().includes("wikipedia")) {
            await pesquisarAutomatico(msg);
        }

    } catch (error) {
        console.error("Erro de IA:", error);
        botSay("😅 Desculpa, Roberto! Estou com um problema de conexão. Tenta de novo?");
    }
}

// ============================================================
// 4️⃣ PESQUISA AUTOMÁTICA
// ============================================================
async function pesquisarAutomatico(tema) {
    try {
        const wikis = ['pt', 'en', 'es'];
        let query = tema.toLowerCase().trim();
        query = query.replace(/o que e|quem e|me explica|fala sobre|pesquisa|como|por que|qual|quando|o que|qual é/g, "").trim();

        if (!query || query.length < 2) return;

        for (let l of wikis) {
            try {
                const r = await fetch(`https://${l}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}?origin=*`);
                if (r.ok) {
                    const d = await r.json();
                    const extract = d.extract.substring(0, 400);
                    botSay(`📚 **Wiki (${l.toUpperCase()}):** ${extract}...`);
                    return;
                }
            } catch(e) {}
        }
    } catch(e) {
        console.log("Pesquisa não funcionou");
    }
}

// ============================================================
// 5️⃣ LÓGICA DOS JOGOS
// ============================================================
function iniciarJogo(letra) {
    modoJogo = true;
    if (letra === "a") {
        respostaCerta = Math.floor(Math.random() * 10) + 1;
        botSay("🎰 Pensei em um número de **1 a 10**. Qual seu palpite?");
    } else if (letra === "b") {
        let n1 = Math.floor(Math.random() * 100), n2 = Math.floor(Math.random() * 100);
        respostaCerta = n1 + n2;
        botSay(`🧮 Roberto, quanto é **${n1} + ${n2}**?`);
    } else if (letra === "c") {
        let p = DATABASE.anatomia[Math.floor(Math.random() * DATABASE.anatomia.length)];
        respostaCerta = p.a;
        botSay(`🧬 **ANATOMIA:** ${p.q}`);
    } else if (letra === "d") {
        let p = DATABASE.geografia[Math.floor(Math.random() * DATABASE.geografia.length)];
        respostaCerta = p.a;
        botSay(`🌍 **CAPITAIS:** ${p.q}`);
    } else if (letra === "e") {
        const pal = ["inforbot", "roberto", "ciencia", "tecnologia"];
        let escolhida = pal[Math.floor(Math.random() * pal.length)];
        respostaCerta = escolhida;
        botSay(`🔄 **INVERTIDO:** Que palavra é esta: **${escolhida.split('').reverse().join('')}**?`);
    }
}

function abrirMenuJogos() {
    analyze("jogos");
}

// ============================================================
// 6️⃣ FUNÇÕES DE INTERFACE
// ============================================================
function botSay(txt) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "bot-msg";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = txt;
    div.appendChild(bubble);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function botSayAnim(txt, tipo) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "bot-msg";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.classList.add(tipo === "acerto" ? "msg-acerto" : "msg-erro");
    bubble.innerHTML = txt;
    div.appendChild(bubble);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function userSay(txt) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "user-msg";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = txt;
    div.appendChild(bubble);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function setLoading(show) {
    const loader = document.getElementById("loading");
    if(loader) loader.style.display = show ? "flex" : "none";
}

function limparChat() {
    const chat = document.getElementById("chat");
    chat.innerHTML = '<div class="bot-msg"><div class="bubble">🤖 Chat limpo! Vamos começar do zero?</div></div>';
    conversaHistory = [];
    localStorage.removeItem("inforbot_historico");
}

function setMode(mode) {
    if (mode === "light") {
        document.body.classList.add("light-mode");
        localStorage.setItem("theme", "light");
    } else {
        document.body.classList.remove("light-mode");
        localStorage.setItem("theme", "dark");
    }
}

function listen() {
    alert("🎤 Reconhecimento de voz em desenvolvimento!");
}

// ============================================================
// 7️⃣ INICIALIZAÇÃO
// ============================================================
window.addEventListener("load", () => {
    // Carregar tema
    const theme = localStorage.getItem("theme");
    if (theme === "light") {
        document.body.classList.add("light-mode");
    }
    
    // Carregar histórico
    carregarHistorico();
});

// Evento de teclado
document.getElementById("userInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") send();
});

</script>
</body>
</html>
